[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-leetcode-lab"
version = "0.1.0"
description = "可审计、有限重试的 AI LeetCode 刷题实验环境"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Problem Solving Lab" }]
dependencies = []

[project.scripts]
ai-lc = "ai_leetcode.cli:main"

[tool.setuptools.packages.find]
include = ["ai_leetcode*"]
